<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Caelestia Plugins Suite</title>
  <desc id="hero-desc">PowerToys-inspired productivity plugins suite for Caelestia Shell on Hyprland Wayland with Material 3 design elements.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111B"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="glow-primary" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#89B4FA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-accent" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#CBA6F7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#CBA6F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CDD6F4"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#89B4FA"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28283D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1E1E2E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Filter for Cards -->
    <filter id="m3-shadow" x="-8%" y="-8%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Base with M3 Surface Corner Radius -->
  <rect width="1200" height="420" rx="28" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow-primary)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow-accent)"/>
  <rect width="1200" height="420" rx="28" fill="none" stroke="#45475A" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Ambient Navigation / Status Track Line -->
  <path d="M 50 32 L 1150 32" stroke="#313244" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- ================= LEFT COLUMN: HERO INFORMATION ================= -->
  <g transform="translate(64, 60)">
    <!-- Category / Platform Pill Chip -->
    <g transform="translate(0, 0)">
      <rect width="280" height="34" rx="17" fill="#181825" stroke="#45475A" stroke-width="1"/>
      <circle cx="18" cy="17" r="5" fill="#89B4FA"/>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#CDD6F4" letter-spacing="1">WAYLAND • HYPRLAND • M3</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
      Caelestia Plugins
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#A6ADC8">
      Windows PowerToys-inspired productivity suite for
    </text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#CDD6F4">
      Caelestia Shell with native Quickshell &amp; Material 3 UI.
    </text>

    <!-- Architectural Feature Pills -->
    <g transform="translate(0, 192)">
      <!-- Pill 1: Color Picker -->
      <g transform="translate(0, 0)">
        <rect width="140" height="36" rx="18" fill="#181825" stroke="#89B4FA" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="20" cy="18" r="6" fill="#89B4FA"/>
        <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#CDD6F4">Color Picker</text>
      </g>

      <!-- Pill 2: OCR Extractor -->
      <g transform="translate(152, 0)">
        <rect width="144" height="36" rx="18" fill="#181825" stroke="#CBA6F7" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="20" cy="18" r="6" fill="#CBA6F7"/>
        <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#CDD6F4">OCR Extractor</text>
      </g>

      <!-- Pill 3: News Feed -->
      <g transform="translate(308, 0)">
        <rect width="134" height="36" rx="18" fill="#181825" stroke="#94E2D5" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="20" cy="18" r="6" fill="#94E2D5"/>
        <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#CDD6F4">News Feed</text>
      </g>
    </g>

    <!-- Terminal Command Snippet Box -->
    <g transform="translate(0, 252)">
      <rect width="442" height="44" rx="12" fill="#11111B" stroke="#313244" stroke-width="1"/>
      <!-- Prompt symbol -->
      <text x="18" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#89B4FA">$</text>
      <!-- Command text -->
      <text x="36" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="500" fill="#CDD6F4">./install.sh all</text>
      <!-- Right Badge -->
      <rect x="314" y="8" width="114" height="28" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
      <text x="325" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#A6ADC8">1-Cmd Deploy</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: MATERIAL 3 COMPONENT SPECIMENS ================= -->
  <g transform="translate(600, 60)">

    <!-- CARD 1: Color Picker Interactive Specimen -->
    <g transform="translate(0, 0)" filter="url(#m3-shadow)">
      <rect width="536" height="88" rx="20" fill="url(#card-surface)" stroke="#45475A" stroke-width="1"/>
      <!-- Left Color Dot / Loupe Swatch -->
      <rect x="18" y="18" width="52" height="52" rx="14" fill="#89B4FA"/>
      <!-- Pipette icon representation inside swatch -->
      <path d="M 50 32 L 44 26 C 42 24 39 24 37 26 L 31 32 L 35 36 L 27 44 L 27 47 L 30 47 L 38 39 L 42 43 L 48 37 C 50 35 50 32 48 30 Z" fill="#11111B"/>
      
      <!-- Card Titles -->
      <text x="86" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#CDD6F4">Color Picker</text>
      <text x="86" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A6ADC8">hyprpicker + 5-shade luminance generator</text>

      <!-- 5-Shade Swatch Bar -->
      <g transform="translate(344, 28)">
        <rect x="0" y="0" width="30" height="32" rx="6" fill="#B4BEFE"/>
        <rect x="34" y="0" width="30" height="32" rx="6" fill="#89B4FA"/>
        <rect x="68" y="0" width="30" height="32" rx="6" fill="#74C7EC"/>
        <rect x="102" y="0" width="30" height="32" rx="6" fill="#89DCEB"/>
        <rect x="136" y="0" width="36" height="32" rx="6" fill="#181825" stroke="#45475A" stroke-width="1"/>
        <text x="141" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#89B4FA">HEX</text>
      </g>
    </g>

    <!-- CARD 2: Text Extractor (OCR) Specimen -->
    <g transform="translate(0, 104)" filter="url(#m3-shadow)">
      <rect width="536" height="88" rx="20" fill="url(#card-surface)" stroke="#45475A" stroke-width="1"/>
      <!-- Icon Container -->
      <rect x="18" y="18" width="52" height="52" rx="14" fill="#181825" stroke="#CBA6F7" stroke-width="1.5"/>
      <!-- Scanner Crop Mark Representation -->
      <path d="M 32 29 L 27 29 L 27 34 M 57 29 L 62 29 L 62 34 M 27 54 L 27 59 L 32 59 M 62 54 L 62 59 L 57 59" stroke="#CBA6F7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <text x="35" y="49" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#CBA6F7">OCR</text>

      <!-- Card Titles -->
      <text x="86" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#CDD6F4">Text Extractor</text>
      <text x="86" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A6ADC8">slurp + grim + tesseract 5.5 neural engine</text>

      <!-- Extracted Text Chip Preview -->
      <g transform="translate(356, 28)">
        <rect width="162" height="32" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#A6E3A1"/>
        <text x="28" y="21" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#CDD6F4">Auto-copied to clip</text>
      </g>
    </g>

    <!-- CARD 3: News Feed Specimen -->
    <g transform="translate(0, 208)" filter="url(#m3-shadow)">
      <rect width="536" height="88" rx="20" fill="url(#card-surface)" stroke="#45475A" stroke-width="1"/>
      <!-- Icon Container -->
      <rect x="18" y="18" width="52" height="52" rx="14" fill="#181825" stroke="#94E2D5" stroke-width="1.5"/>
      <!-- RSS Wave Representation -->
      <circle cx="33" cy="55" r="3.5" fill="#94E2D5"/>
      <path d="M 31 43 A 12 12 0 0 1 45 57" stroke="#94E2D5" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M 31 34 A 21 21 0 0 1 54 57" stroke="#94E2D5" stroke-width="2.2" stroke-linecap="round" fill="none"/>

      <!-- Card Titles -->
      <text x="86" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#CDD6F4">News Feed</text>
      <text x="86" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A6ADC8">Live RSS/Atom reader &amp; presets catalog</text>

      <!-- Feed Source Tags -->
      <g transform="translate(322, 28)">
        <rect x="0" y="0" width="58" height="32" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94E2D5">Arch</text>
        <rect x="64" y="0" width="64" height="32" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
        <text x="74" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#CDD6F4">Reddit</text>
        <rect x="134" y="0" width="62" height="32" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
        <text x="146" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FAB387">HN</text>
      </g>
    </g>

  </g>

  <!-- Bottom Accent Status Line -->
  <rect x="64" y="386" width="1072" height="2" rx="1" fill="#313244" opacity="0.6"/>
  <circle cx="64" cy="387" r="3" fill="#89B4FA"/>
  <circle cx="1136" cy="387" r="3" fill="#CBA6F7"/>
</svg>
