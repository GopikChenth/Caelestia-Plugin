<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Caelestia Plugins Suite</title>
  <desc id="hero-desc">PowerToys-inspired productivity plugins suite for Caelestia Shell on Hyprland Wayland with Material 3 design elements.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111B"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="glow-primary" cx="15%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#89B4FA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-accent" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#CBA6F7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#CBA6F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CDD6F4"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#89B4FA"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28283D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1E1E2E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Elevation Filter -->
    <filter id="m3-shadow" x="-5%" y="-8%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Base with M3 Surface Corner Radius -->
  <rect width="1200" height="420" rx="28" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow-primary)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow-accent)"/>
  <rect width="1200" height="420" rx="28" fill="none" stroke="#45475A" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Ambient Navigation / Track Line -->
  <path d="M 48 30 L 1152 30" stroke="#313244" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- ================= LEFT COLUMN: HERO INFORMATION ================= -->
  <g transform="translate(54, 54)">
    <!-- Category / Platform Pill Chip -->
    <rect width="264" height="32" rx="16" fill="#181825" stroke="#45475A" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#89B4FA"/>
    <text x="30" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#CDD6F4" letter-spacing="1">WAYLAND • HYPRLAND • M3</text>

    <!-- Main Title -->
    <text x="0" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">Caelestia Plugins</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" fill="#A6ADC8">Windows PowerToys-inspired desktop tools</text>
    <text x="0" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" fill="#CDD6F4">for Caelestia Shell with native Quickshell UI.</text>

    <!-- Plugin Quick Pills -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="126" height="34" rx="17" fill="#181825" stroke="#89B4FA" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#89B4FA"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#CDD6F4">Color Picker</text>

      <rect x="138" y="0" width="136" height="34" rx="17" fill="#181825" stroke="#CBA6F7" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#CBA6F7"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#CDD6F4">OCR Extractor</text>

      <rect x="286" y="0" width="122" height="34" rx="17" fill="#181825" stroke="#94E2D5" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#94E2D5"/>
      <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#CDD6F4">News Feed</text>
    </g>

    <!-- Command Snippet Box -->
    <g transform="translate(0, 238)">
      <rect width="410" height="42" rx="12" fill="#11111B" stroke="#313244" stroke-width="1"/>
      <text x="16" y="26" font-family="monospace" font-size="15" font-weight="700" fill="#89B4FA">$</text>
      <text x="34" y="26" font-family="monospace" font-size="14" font-weight="500" fill="#CDD6F4">./install.sh all</text>
      <rect x="288" y="7" width="114" height="28" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
      <text x="299" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#A6ADC8">1-Cmd Deploy</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: 630px WIDE CARDS (ZERO OVERLAP) ================= -->
  <g transform="translate(516, 52)">

    <!-- CARD 1: Color Picker -->
    <g transform="translate(0, 0)" filter="url(#m3-shadow)">
      <rect width="630" height="92" rx="20" fill="url(#card-surface)" stroke="#45475A" stroke-width="1"/>
      <rect x="18" y="20" width="52" height="52" rx="14" fill="#89B4FA"/>
      <path d="M 50 34 L 44 28 C 42 26 39 26 37 28 L 31 34 L 35 38 L 27 46 L 27 49 L 30 49 L 38 41 L 42 45 L 48 39 C 50 37 50 34 48 32 Z" fill="#11111B"/>

      <text x="86" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#CDD6F4">Color Picker</text>
      <text x="86" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#A6ADC8">Precision loupe &amp; 5-tier shade inspector</text>

      <!-- Swatches: x=458 to 612 (154px wide, >150px gap from text) -->
      <g transform="translate(458, 30)">
        <rect x="0" y="0" width="24" height="32" rx="6" fill="#B4BEFE"/>
        <rect x="28" y="0" width="24" height="32" rx="6" fill="#89B4FA"/>
        <rect x="56" y="0" width="24" height="32" rx="6" fill="#74C7EC"/>
        <rect x="84" y="0" width="24" height="32" rx="6" fill="#89DCEB"/>
        <rect x="114" y="0" width="40" height="32" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
        <text x="122" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#89B4FA">HEX</text>
      </g>
    </g>

    <!-- CARD 2: Text Extractor -->
    <g transform="translate(0, 108)" filter="url(#m3-shadow)">
      <rect width="630" height="92" rx="20" fill="url(#card-surface)" stroke="#45475A" stroke-width="1"/>
      <rect x="18" y="20" width="52" height="52" rx="14" fill="#181825" stroke="#CBA6F7" stroke-width="1.5"/>
      <path d="M 32 31 L 27 31 L 27 36 M 57 31 L 62 31 L 62 36 M 27 56 L 27 61 L 32 61 M 62 56 L 62 61 L 57 61" stroke="#CBA6F7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <text x="34" y="51" font-family="monospace" font-size="14" font-weight="800" fill="#CBA6F7">OCR</text>

      <text x="86" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#CDD6F4">Text Extractor</text>
      <text x="86" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#A6ADC8">Neural screen OCR &amp; clean clipboard copy</text>

      <!-- Auto-copied chip: x=466 to 612 (146px wide, >150px gap from text) -->
      <g transform="translate(466, 30)">
        <rect width="146" height="32" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#A6E3A1"/>
        <text x="28" y="21" font-family="monospace" font-size="11.5" font-weight="600" fill="#CDD6F4">Auto-copied</text>
      </g>
    </g>

    <!-- CARD 3: News Feed -->
    <g transform="translate(0, 216)" filter="url(#m3-shadow)">
      <rect width="630" height="92" rx="20" fill="url(#card-surface)" stroke="#45475A" stroke-width="1"/>
      <rect x="18" y="20" width="52" height="52" rx="14" fill="#181825" stroke="#94E2D5" stroke-width="1.5"/>
      <circle cx="33" cy="57" r="3.5" fill="#94E2D5"/>
      <path d="M 31 45 A 12 12 0 0 1 45 59" stroke="#94E2D5" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M 31 36 A 21 21 0 0 1 54 59" stroke="#94E2D5" stroke-width="2.2" stroke-linecap="round" fill="none"/>

      <text x="86" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#CDD6F4">News Feed</text>
      <text x="86" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#A6ADC8">Live RSS/Atom stream &amp; curated presets</text>

      <!-- Feed source tags: x=470 to 612 (142px wide, >160px gap from text) -->
      <g transform="translate(470, 30)">
        <rect x="0" y="0" width="44" height="32" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
        <text x="8" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#94E2D5">Arch</text>
        <rect x="49" y="0" width="50" height="32" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
        <text x="57" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#CDD6F4">Reddit</text>
        <rect x="104" y="0" width="38" height="32" rx="8" fill="#181825" stroke="#45475A" stroke-width="1"/>
        <text x="114" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#FAB387">HN</text>
      </g>
    </g>

  </g>

  <!-- Bottom Accent Line -->
  <rect x="48" y="388" width="1104" height="2" rx="1" fill="#313244" opacity="0.6"/>
  <circle cx="48" cy="389" r="3" fill="#89B4FA"/>
  <circle cx="1152" cy="389" r="3" fill="#CBA6F7"/>
</svg>